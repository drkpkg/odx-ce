[package]
name = "odoo-cli"
version = "1.2.2"
edition = "2021"
description = "odx: Odoo development CLI"
license = "MIT"
repository = "https://github.com/drkpkg/odx-ce"

[package.metadata.deb]
name = "odx"
maintainer = "drkpkg"
copyright = "2026"
license-file = ["LICENSE", "4"]
extended-description = """\
odx is a Rust CLI to scaffold and operate Odoo development projects.\
"""
depends = "python3, python3-venv, ca-certificates"
section = "utils"
priority = "optional"
assets = [
  ["target/release/odx", "usr/bin/odx", "755"],
  ["README.md", "usr/share/doc/odx/README.md", "644"],
]

[[bin]]
name = "odx"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
configparser = "3.0"
dirs = "6.0"
which = "8.0"
git2 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
regex = "1.12"
ctrlc = "3.4"
indicatif = "0.18"
inquire = "0.9"
console = "0.16"
etc-os-release = "0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
